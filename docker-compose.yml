services:
  postgres:
    image: postgres:16
    container_name: morocco_market_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build: ./airflow
    container_name: morocco_market_airflow
    restart: unless-stopped
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside Docker, the database is reached by its service name
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://\
        ${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Africa/Casablanca
      # Local development only: no login screen
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project

  metabase:
    image: metabase/metabase:v0.64.5.5
    container_name: morocco_market_metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Where Metabase stores its own settings (users, dashboards)
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      JAVA_TIMEZONE: Africa/Casablanca
    ports:
      - "3000:3000"

volumes:
  postgres_data:
